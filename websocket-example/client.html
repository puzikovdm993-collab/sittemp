<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Клиент - Пример для новичков</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            transition: background 0.3s;
        }

        .status-indicator.connected {
            background: #28a745;
        }

        .status-text {
            font-weight: bold;
        }

        .main-content {
            padding: 20px;
        }

        .messages-container {
            height: 400px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }

        .message.sent {
            background: #cce5ff;
            border-left: 4px solid #007bff;
            text-align: right;
        }

        .message.system {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .message.error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }

        .message-time {
            font-size: 0.8em;
            color: #6c757d;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .commands-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .commands-section h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .command-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .command-info {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            font-size: 0.9em;
            color: #6c757d;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .stat-item {
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-label {
            font-size: 0.8em;
            color: #6c757d;
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 WebSocket Клиент</h1>
            <p>Интерактивный пример для изучения WebSocket</p>
        </div>

        <div class="status-bar">
            <div class="connection-status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="status-text" id="statusText">Отключено</span>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Сообщений</div>
                    <div class="stat-value" id="messageCount">0</div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="messages-container" id="messagesContainer">
                <!-- Сообщения будут добавляться сюда -->
            </div>

            <div class="input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Введите сообщение..."
                    disabled
                >
                <button class="btn btn-primary" id="sendBtn" disabled>Отправить</button>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn btn-success" id="connectBtn">Подключиться</button>
                <button class="btn btn-danger" id="disconnectBtn" disabled>Отключиться</button>
            </div>

            <div class="commands-section">
                <h3>⚡ Быстрые команды</h3>
                <div class="command-buttons">
                    <button class="btn btn-primary" onclick="sendCommand('time')" disabled id="cmdTime">
                        🕐 Время сервера
                    </button>
                    <button class="btn btn-primary" onclick="sendCommand('count')" disabled id="cmdCount">
                        📊 Статистика
                    </button>
                    <button class="btn btn-primary" onclick="sendBroadcast()" disabled id="cmdBroadcast">
                        📢 Тест рассылки
                    </button>
                </div>
                <div class="command-info">
                    <strong>💡 Подсказка:</strong> Откройте эту страницу в нескольких вкладках браузера, 
                    чтобы протестировать рассылку сообщений между клиентами!
                </div>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let websocket = null;
        let messageCount = 0;
        const WS_URL = 'ws://localhost:8765';

        // Элементы DOM
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const messageCountEl = document.getElementById('messageCount');
        const cmdButtons = document.querySelectorAll('.command-buttons button');

        // Функция для добавления сообщения в чат
        function addMessage(text, type = 'received') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString();
            messageDiv.innerHTML = `
                <div>${text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            messageCount++;
            messageCountEl.textContent = messageCount;
        }

        // Обновление состояния интерфейса
        function updateUI(connected) {
            if (connected) {
                statusIndicator.classList.add('connected');
                statusText.textContent = 'Подключено';
                statusText.style.color = '#28a745';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                cmdButtons.forEach(btn => btn.disabled = false);
            } else {
                statusIndicator.classList.remove('connected');
                statusText.textContent = 'Отключено';
                statusText.style.color = '#dc3545';
                messageInput.disabled = true;
                sendBtn.disabled = true;
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                cmdButtons.forEach(btn => btn.disabled = true);
            }
        }

        // Подключение к WebSocket серверу
        function connect() {
            try {
                websocket = new WebSocket(WS_URL);

                websocket.onopen = () => {
                    addMessage('✅ Успешно подключено к серверу!', 'system');
                    updateUI(true);
                };

                websocket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (e) {
                        addMessage(`Получено: ${event.data}`, 'received');
                    }
                };

                websocket.onclose = () => {
                    addMessage('❌ Соединение закрыто', 'error');
                    updateUI(false);
                    websocket = null;
                };

                websocket.onerror = (error) => {
                    addMessage('⚠️ Ошибка соединения', 'error');
                    console.error('WebSocket error:', error);
                };

            } catch (error) {
                addMessage(`Ошибка подключения: ${error.message}`, 'error');
            }
        }

        // Обработка полученных сообщений
        function handleMessage(data) {
            switch(data.type) {
                case 'welcome':
                    addMessage(`🎉 ${data.message}<br>Подключенных клиентов: ${data.connected_clients}`, 'system');
                    break;
                case 'echo':
                    addMessage(`📬 ${data.server_response}<br>(Сообщение #${data.message_number})`, 'received');
                    break;
                case 'command_response':
                    addMessage(`⚡ Команда "${data.command}": ${data.data}<br>${data.message}`, 'system');
                    break;
                case 'broadcast':
                    addMessage(`📢 Рассылка от ${data.from}: ${data.message}`, 'received');
                    break;
                case 'confirmation':
                    addMessage(`✅ ${data.message}`, 'system');
                    break;
                default:
                    addMessage(`Получено: ${JSON.stringify(data)}`, 'received');
            }
        }

        // Отключение от сервера
        function disconnect() {
            if (websocket) {
                websocket.close();
            }
        }

        // Отправка сообщения
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && websocket && websocket.readyState === WebSocket.OPEN) {
                const data = {
                    message: message,
                    timestamp: new Date().toISOString()
                };
                websocket.send(JSON.stringify(data));
                addMessage(`📤 Вы: ${message}`, 'sent');
                messageInput.value = '';
            }
        }

        // Отправка команды
        function sendCommand(command) {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                const data = { command: command };
                websocket.send(JSON.stringify(data));
            }
        }

        // Отправка тестовой рассылки
        function sendBroadcast() {
            const testMessage = `Тестовая рассылка от ${new Date().toLocaleTimeString()}`;
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                const data = {
                    command: 'broadcast',
                    message: testMessage
                };
                websocket.send(JSON.stringify(data));
                addMessage(`📤 Вы отправили рассылку: ${testMessage}`, 'sent');
            }
        }

        // Обработчики событий
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Инициализация
        updateUI(false);
        addMessage('👋 Нажмите "Подключиться" для начала работы с WebSocket', 'system');
    </script>
</body>
</html>
